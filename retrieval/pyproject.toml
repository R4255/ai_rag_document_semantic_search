[project]
name = "ragv2"
version = "0.1.0"
description = "Hybrid (BM25 + dense), reranked, evaluated retrieval for RAG"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
ml = ["sentence-transformers>=2.7"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["ragv2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
